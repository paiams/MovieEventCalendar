name: Update Movie Coupon Events

on:
  schedule:
    # 정각의 GitHub Actions 혼잡을 피하여 UTC 기준 2시간마다 17분에 실행
    - cron: '17 */2 * * *'
  workflow_dispatch:
    # 수동 실행 트리거 제공
  push:
    # 코드를 커밋하고 푸시할 때마다 즉시 워크플로우 실행
    branches:
      - main

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: movie-events-deployment
  cancel-in-progress: false

jobs:
  update-events:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend Tests
        working-directory: backend
        run: python -m unittest discover -s tests -v

      - name: Run Crawler
        env:
          CGV_WORKER_URL: ${{ vars.CGV_WORKER_URL }}
        run: |
          python backend/main.py
          
      - name: Set up Node.js
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Frontend dependencies
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          cd frontend
          npm ci

      - name: Test CGV Worker
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: node --test workers/cgv/worker.test.mjs

      - name: Lint Frontend
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          cd frontend
          npm run lint

      - name: Build Frontend
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          cd frontend
          npm run build

      - name: Deploy Frontend (Full)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/dist
          publish_branch: gh-pages
          cname: ${{ vars.CUSTOM_DOMAIN }}
          force_orphan: false
          user_name: 'github-actions[bot]'
          user_email: '41898282+github-actions[bot]@users.noreply.github.com'
          commit_message: "Auto Update: Web App (Build)"

      - name: Deploy Data Only (Schedule)
        if: github.event_name == 'schedule'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/public/data
          destination_dir: data
          publish_branch: gh-pages
          keep_files: true
          user_name: 'github-actions[bot]'
          user_email: '41898282+github-actions[bot]@users.noreply.github.com'
          commit_message: "Auto Update: Movie Events Data"
