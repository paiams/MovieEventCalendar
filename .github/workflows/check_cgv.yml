name: Check CGV access

on:
  push:
    branches: [codex/cgv-access-fix]

permissions:
  contents: read

jobs:
  check-cgv:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - run: pip install requests==2.34.2 curl_cffi==0.16.3
      - name: Compare CGV requests
        run: |
          python -u - <<'PY'
          import requests
          from curl_cffi import requests as chrome_requests

          for name, session in (
              ("requests", requests.Session()),
              ("chrome", chrome_requests.Session(impersonate="chrome")),
          ):
              with session:
                  for path, params in (
                      ("/tme/itgrSrch", {"swrd": "쿠폰"}),
                      ("/api/v1/common/timeline/more/itgrSrch/searchItgrSrchAll", {"coCd": "A420", "swrd": "쿠폰"}),
                  ):
                      response = session.get("https://cgv.co.kr" + path, params=params, timeout=(5, 20))
                      print(name, path, response.status_code, response.headers.get("cf-mitigated"), response.headers.get("cf-ray"), flush=True)
                      if response.status_code != 200:
                          print(response.text[:1200], flush=True)
                      if name == "chrome":
                          response.raise_for_status()
                          if "/api/" in path:
                              events = response.json()["data"]["evntInfo"]["evntLst"]
                              print("CGV events:", len(events), flush=True)
          PY
