name: Check CGV access

on:
  push:
    branches: [codex/cgv-access-fix]

permissions:
  contents: read

jobs:
  check-cgv:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - run: pip install -r backend/requirements.txt
      - name: Check CGV crawler
        shell: bash
        run: |
          python -u - <<'PY'
          import sys
          sys.path.insert(0, "backend")
          from crawlers.cgv import get_cgv_coupons
          events = get_cgv_coupons()
          assert events, "Expected current CGV coupons"
          print("CGV coupons:", len(events))
          for event in events:
              print(event.id, event.title, event.startDate)
          PY
