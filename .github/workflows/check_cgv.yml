name: Check CGV access

on:
  push:
    branches: [codex/cgv-access-fix]

permissions:
  contents: read

jobs:
  check-cgv:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CGV_WORKER_URL: https://movie-event-cgv.ubiquitous-textbook.workers.dev
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - run: pip install -r backend/requirements.txt
      - name: Run backend tests
        working-directory: backend
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node --test workers/cgv/worker.test.mjs
      - name: Check all crawlers through CGV Worker
        run: python -u backend/main.py
