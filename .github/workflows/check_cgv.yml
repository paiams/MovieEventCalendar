name: Check CGV access

on:
  push:
    branches: [codex/cgv-access-fix]

permissions:
  contents: read

jobs:
  check-cgv:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CGV_WORKER_URL: https://movie-event-cgv.kbh1933.workers.dev
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - run: pip install -r backend/requirements.txt
      - name: Run backend tests
        working-directory: backend
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node --test workers/cgv/worker.test.mjs
      - name: Inspect Worker response
        run: |
          python - <<'PY'
          import os, requests
          response = requests.get(os.environ['CGV_WORKER_URL'], timeout=30)
          print('status:', response.status_code)
          print('headers:', {key: value for key, value in response.headers.items() if key.lower() in ('server', 'cf-ray', 'cf-placement', 'content-type')})
          print('body:', response.text[:150])
          PY
      - name: Check all crawlers through CGV Worker
        run: python -u backend/main.py
