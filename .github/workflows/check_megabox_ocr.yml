name: Check Megabox image OCR

on:
  push:
    branches:
      - test/megabox-ocr
    paths:
      - .github/workflows/check_megabox_ocr.yml

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check-ocr:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install crawler dependencies
        run: pip install -r backend/requirements.txt

      - name: Test crawler and OCR fallback
        working-directory: backend
        run: python -m unittest discover -s tests -v

      - name: Install Korean and English OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-kor tesseract-ocr-eng
          tesseract --version
          tesseract --list-langs

      - name: Verify production crawler and image cache
        env:
          PYTHONPATH: backend
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import time
          from pathlib import Path
          from unittest.mock import patch

          from crawlers.megabox import get_megabox_zero_tickets

          output = Path(os.environ['RUNNER_TEMP']) / 'megabox-ocr'
          output.mkdir()
          cache = output / 'megabox-ocr-cache.json'
          expected = '2026-11-13 12:00:00'
          run_ocr = subprocess.run
          started = time.perf_counter()
          with patch('crawlers.megabox_ocr.subprocess.run', wraps=run_ocr) as ocr:
              first = get_megabox_zero_tickets(ocr_cache_path=cache)
              assert ocr.call_count >= 1, 'First crawl did not run OCR'
          goods = next(event for event in first if event.id == 'mega-21595')
          assert goods.startDate == expected and not goods.timeUnknown, goods
          assert cache.is_file(), 'OCR cache was not persisted'
          first_seconds = round(time.perf_counter() - started, 3)
          original_cache = cache.read_bytes()

          started = time.perf_counter()
          with patch('crawlers.megabox_ocr.subprocess.run', side_effect=AssertionError('Repeated OCR')):
              second = get_megabox_zero_tickets(first, ocr_cache_path=cache)
          cached_goods = next(event for event in second if event.id == 'mega-21595')
          assert cached_goods.startDate == expected and not cached_goods.timeUnknown, cached_goods
          assert original_cache == cache.read_bytes(), 'Identical image rewrote the OCR cache'
          cached_seconds = round(time.perf_counter() - started, 3)

          (output / 'events.json').write_text(json.dumps([event.to_dict() for event in second], ensure_ascii=False, indent=2), encoding='utf-8')
          print(f'PASS: production crawler extracted {goods.startDate} KST; next crawl reused cached OCR')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write(f'Production crawler extracted **{goods.startDate} KST** from event 21595.\n\n')
              summary.write(f'- First crawl with OCR: {first_seconds} seconds\n')
              summary.write(f'- Second crawl without OCR: {cached_seconds} seconds\n')
          PY

      - name: Upload banner and OCR evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: megabox-ocr-evidence
          path: ${{ runner.temp }}/megabox-ocr/
          retention-days: 7
