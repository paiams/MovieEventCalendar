name: Check Megabox image OCR

on:
  push:
    branches:
      - test/megabox-ocr
    paths:
      - .github/workflows/check_megabox_ocr.yml

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check-ocr:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install Korean and English OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-kor tesseract-ocr-eng
          tesseract --version
          tesseract --list-langs

      - name: Extract and verify the live goods start time
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          import time
          import urllib.request
          from datetime import datetime
          from pathlib import Path

          output = Path(os.environ['RUNNER_TEMP']) / 'megabox-ocr'
          output.mkdir()
          image_url = 'https://img.megabox.co.kr/SharedImg/editorImg/2026/11/10/5Mb44qQePFCGpAVyOFa8jCu7D7c0LuQS.jpg'
          image = output / '21595.jpg'
          with urllib.request.urlopen(image_url, timeout=30) as response:
              image.write_bytes(response.read())
          print(f'Downloaded {image.stat().st_size} bytes from {image_url}')

          results = []
          for mode in ('3', '11'):
              started = time.perf_counter()
              completed = subprocess.run(
                  ['tesseract', str(image), 'stdout', '-l', 'kor+eng', '--psm', mode],
                  capture_output=True, text=True, check=True, timeout=60,
              )
              elapsed = round(time.perf_counter() - started, 3)
              text = completed.stdout
              (output / f'psm-{mode}.txt').write_text(text, encoding='utf-8')
              lines = [line for line in text.splitlines() if re.search(r'\d{1,2}\s*:\s*\d{2}|다운로드', line)]
              results.append({'psm': mode, 'seconds': elapsed, 'evidence': lines})
              print(json.dumps(results[-1], ensure_ascii=False))

          (output / 'results.json').write_text(json.dumps(results, ensure_ascii=False, indent=2), encoding='utf-8')
          text = (output / 'psm-11.txt').read_text(encoding='utf-8')
          matches = re.findall(
              r'쿠폰\s*다운로드는\s*(\d{1,2})\s*[.월]\s*(\d{1,2})[^\n]{0,20}?(\d{1,2})\s*:\s*(\d{2})',
              text,
          )
          assert matches, 'OCR did not identify an explicit coupon download start time'
          candidates = {datetime(2026, *map(int, match)) for match in matches}
          expected = datetime(2026, 11, 13, 12, 0)
          assert candidates == {expected}, f'Unexpected or ambiguous start times: {candidates}'
          normalized = next(iter(candidates)).strftime('%Y-%m-%d %H:%M:%S')
          print(f'PASS: coupon download starts at {normalized} KST')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write(f'Native Tesseract on Ubuntu 24.04 extracted **{normalized} KST** from event 21595.\n\n')
              for result in results:
                  summary.write(f'- PSM {result["psm"]}: {result["seconds"]} seconds\n')
          PY

      - name: Upload banner and OCR evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: megabox-ocr-evidence
          path: ${{ runner.temp }}/megabox-ocr/
          retention-days: 7
